# 全部 language: system，二进制由仓内 mise.toml 提供；entry 包一层 `mise exec --`，
# 这样不依赖 shell 里 activate 过 mise（IDE 里提交也能跑）。
repos:
  - repo: local
    hooks:
      # 中英文混排的空格与标点纠正；不带 --lint 时永远退 0，等于没检查。
      - id: autocorrect
        name: autocorrect
        entry: mise exec -- autocorrect --lint
        language: system
        files: ^notes/.*\.md$
      - id: normalize-yaml
        name: Normalize YAML front matter
        entry: mise exec -- uv run scripts/normalize_yaml.py
        language: system
        files: ^notes/.*\.md$
      - id: generate-notes-index
        name: Generate notes index
        entry: mise exec -- uv run scripts/generate_notes_index.py
        language: system
        pass_filenames: false
        files: ^notes/.*\.md$
      # 本地互链必须是 notes/<ULID>.md（站点侧 remark 插件再改写成 /<ulid>/）
      - id: check-note-links
        name: Check note links
        entry: mise exec -- uv run scripts/check_note_links.py
        language: system
        files: ^notes/.*\.md$
        pass_filenames: false
      # 外链检查（lycheeverse/lychee），配置见仓根 lychee.toml
      - id: lychee
        name: lychee
        description: "Run 'lychee' for fast, async, stream-based link checking"
        entry: mise exec -- lychee --no-progress
        language: system
        files: ^notes/.*\.md$
        types: [text]
        pass_filenames: true
        require_serial: true
      # -o max --strip safe：截图类实测能压 4~5%，无损（不带参数只剥 iDOT，几十字节）。
      - id: oxipng
        name: oxipng
        entry: mise exec -- oxipng -o max --strip safe
        language: system
        files: ^assets/.+$
        types: [png]
        require_serial: true
