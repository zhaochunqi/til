# 全部走 language: system，二进制由仓内 mise.toml 提供（mise activate 进目录即上 PATH）。
# 之前是 docker_image + language: rust：前者要 docker，后者要 cargo 现场编译（要 cc），
# 在这台 WSL 上都不成立，pre-commit 连环境都装不起来。
repos:
  - repo: local
    hooks:
      # 中英文混排的空格与标点纠正（huacnlee/autocorrect）
      - id: autocorrect
        name: autocorrect
        entry: autocorrect
        language: system
        files: ^notes/.*\.md$
      - id: normalize-yaml
        name: Normalize YAML front matter
        entry: uv run scripts/normalize_yaml.py
        language: system
        files: ^notes/.*\.md$
      - id: generate-notes-index
        name: Generate notes index
        entry: uv run scripts/generate_notes_index.py
        language: system
        pass_filenames: false
        files: ^notes/.*\.md$
      # 链接检查（lycheeverse/lychee）
      - id: lychee
        name: lychee
        description: "Run 'lychee' for fast, async, stream-based link checking"
        entry: lychee
        language: system
        args: ["--no-progress", "--exclude-path", "assets"]
        files: ^notes/.*\.md$
        types: [text]
        pass_filenames: true
        require_serial: true
      # PNG 优化（oxipng/oxipng）
      - id: oxipng
        name: oxipng
        entry: oxipng
        language: system
        files: ^assets/.+$
        types: [png]
        require_serial: true
